<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic List Creator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <h1>Dynamic List Creator</h1>
            <div class="dynamic-list-block">
                <input type="text" name="input-text" id="input-text" placeholder="Add a new item...">
                <button id="add-btn" class="input-btn">Add Item</button>
                <ul id="list" class="dynamic-list"></ul>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
